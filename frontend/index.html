<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Tea Room V3.0</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Encrypted Login Screen -->
    <div id="auth-modal" class="modal-overlay">
        <div class="cute-login-card" id="login-card-inner">
            <div class="bounce-tea">🍵</div>
            <h2 style="color: var(--primary); margin: 10px 0 5px 0;">Tea Vault</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 25px;">Enter your details to unlock your encrypted space.</p>
            
            <div class="auth-form">
                <input type="text" id="auth-username" placeholder="Username" autocomplete="off">
                <input type="password" id="auth-pin" placeholder="4-Digit PIN" maxlength="6">
                <div id="auth-error" class="auth-error"></div>
                <button id="auth-submit-btn" class="btn-primary" style="margin-top: 5px;">Unlock Vault ✨</button>
            </div>
        </div>
    </div>

    <!-- Congrats Bubble Popup -->
    <div id="congrats-modal" class="modal-overlay" style="display: none; z-index: 2000;">
        <div class="cute-login-card bubble-content" id="congrats-card">
            <div style="font-size: 50px; margin-bottom: 10px;">✨☕✨</div>
            <h2 style="color: var(--primary); margin: 0 0 10px 0;">Congratulations!</h2>
            <p style="color: var(--text-dark); margin-bottom: 25px; font-weight: 600;">You have successfully made a teacup!</p>
            <button id="congrats-confirm-btn" class="btn-primary" style="width: 100%;">Confirm</button>
        </div>
    </div>

    <!-- New: Task Archive Modal -->
    <div id="archive-modal" class="modal-overlay" style="display: none; z-index: 1500;">
        <div class="cute-login-card" style="width: 360px; max-height: 80vh; display: flex; flex-direction: column;">
            <div style="font-size: 40px; margin-bottom: 10px;">📦</div>
            <h2 style="color: var(--primary); margin: 0 0 15px 0;">Past Tasks</h2>
            <div id="archive-list" class="archive-list-container"></div>
            <button id="close-archive-btn" class="btn-subtle" style="width: 100%; margin-top: 15px;">Close Archive</button>
        </div>
    </div>

    <!-- Main Navigation -->
    <nav class="top-nav">
        <div class="logo">FOCUS TEA ROOM</div>
        <div class="nav-right">
            <div class="theme-picker">
                <button class="theme-dot" style="background: #9b66ff;" data-color="#9b66ff"></button>
                <button class="theme-dot" style="background: #10b981;" data-color="#10b981"></button>
                <button class="theme-dot" style="background: #0ea5e9;" data-color="#0ea5e9"></button>
                <button class="theme-dot" style="background: #f43f5e;" data-color="#f43f5e"></button>
                <button class="theme-dot" style="background: #f59e0b;" data-color="#f59e0b"></button>
            </div>
            <button id="logout-btn" class="btn-subtle" style="display:none;">🔒 Lock</button>
        </div>
    </nav>

    <div class="dashboard-grid">
        <!-- Left Column -->
        <div class="col">
            <div class="cute-card">
                <div class="card-header"><span style="margin: 0 auto">⏰ LOCAL TIME</span></div>
                
                <div class="analog-clock-container">
                    <span class="clock-num clock-12">12</span>
                    <span class="clock-num clock-3">3</span>
                    <span class="clock-num clock-6">6</span>
                    <span class="clock-num clock-9">9</span>
                    <div class="clock-hand hand-hour" id="hand-hour"></div>
                    <div class="clock-hand hand-min" id="hand-min"></div>
                    <div class="clock-hand hand-sec" id="hand-sec"></div>
                    <div class="clock-center"></div>
                </div>
                
                <div style="font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 25px;" id="digital-time">
                    00:00:00 • Loading...
                </div>

                <div class="card-header"><span style="margin: 0 auto">FOCUS ACCUMULATED</span></div>
                <div class="stats-pills" id="time-pills">
                    <button class="pill active" data-period="day">Day</button>
                    <button class="pill" data-period="week">Week</button>
                    <button class="pill" data-period="month">Month</button>
                    <button class="pill" data-period="year">Year</button>
                </div>
                <h2 style="color: var(--primary); margin: 10px 0;" id="accum-display">0h 0m</h2>
            </div>
        </div>

        <!-- Center Column -->
        <div class="col">
            <div class="cute-card">
                <div class="status-pill" id="status-badge">READY TO BREW</div>
                
                <!-- Vector Animated Teacup & Steam -->
                <div class="tea-container" id="tea-container">
                    <svg class="steam-svg" viewBox="0 0 40 30" width="40" height="25">
                        <path class="steam-line steam-1" d="M 12 25 Q 8 15 12 5" stroke="var(--primary)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                        <path class="steam-line steam-2" d="M 20 25 Q 24 15 20 5" stroke="var(--primary)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                        <path class="steam-line steam-3" d="M 28 25 Q 24 15 28 5" stroke="var(--primary)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    </svg>
                    
                    <svg class="teacup-svg" viewBox="0 0 100 90" width="120" height="108">
                        <defs>
                            <clipPath id="teacup-clip">
                                <path d="M 25 35 C 25 65, 30 75, 50 75 C 70 75, 75 65, 75 35 Z" />
                            </clipPath>
                        </defs>
                        <rect id="tea-liquid-fill" x="20" y="75" width="60" height="0" fill="var(--primary-soft)" clip-path="url(#teacup-clip)" />
                        <path d="M 25 35 C 25 65, 30 75, 50 75 C 70 75, 75 65, 75 35 Z" fill="none" stroke="var(--primary)" stroke-width="4" stroke-linejoin="round"/>
                        <path d="M 75 42 C 88 42, 88 62, 75 62" fill="none" stroke="var(--primary)" stroke-width="4" stroke-linecap="round"/>
                        <path d="M 20 80 Q 50 86 80 80" fill="none" stroke="var(--primary)" stroke-width="4" stroke-linecap="round"/>
                        <!-- Cute Face -->
                        <circle cx="43" cy="50" r="2.5" fill="var(--primary)"/>
                        <circle cx="57" cy="50" r="2.5" fill="var(--primary)"/>
                        <path d="M 47 55 Q 50 58 53 55" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>

                <div class="preset-row">
                    <button class="preset-btn" data-time="15">15m</button>
                    <button class="preset-btn active" data-time="25">25m</button>
                    <button class="preset-btn" data-time="45">45m</button>
                    <button class="preset-btn" data-time="60">60m</button>
                </div>

                <div class="custom-time-box">
                    <input type="number" id="custom-minutes-input" placeholder="Mins" min="1" max="300">
                    <button id="set-custom-btn" class="btn-subtle">Set</button>
                </div>

                <div class="timer-display" id="time-display">25:00</div>

                <div class="main-controls">
                    <button class="btn-start" id="start-btn">Start</button>
                    <button class="btn-pause" id="pause-btn">Pause</button>
                    <button class="btn-reset" id="reset-btn">Reset</button>
                </div>

                <div class="audio-controls">
                    <button class="audio-btn" id="btn-rain">🌧️ Rain</button>
                    <button class="audio-btn active" id="btn-chime">🔔 Chime</button>
                </div>

                <div style="margin-top: 20px; display: flex; justify-content: center;">
                    <button id="open-sink-btn" class="btn-sink">🧽 Go to the Sink</button>
                </div>
            </div>
        </div>

        <!-- Right Column -->
        <div class="col">
            <div class="cute-card">
                <!-- Updated Tasks Header -->
                <div class="card-header" style="align-items: center;">
                    <span>📝 TASKS</span>
                    <button id="open-archive-btn" class="btn-subtle" style="padding: 4px 10px; font-size: 11px;">📦 Archive</button>
                </div>
                <div class="input-group">
                    <input type="text" id="todo-input" placeholder="What to do?">
                    <button id="add-todo-btn">+</button>
                </div>
                <div id="todo-list"></div>
            </div>

            <div class="cute-card">
                <div class="card-header"><span>☕ BREW LOG</span></div>
                <table class="brew-table">
                    <thead><tr><th>TIME</th><th>DUR</th><th>STATUS</th></tr></thead>
                    <tbody id="brew-log-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
