<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Tea Room</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="header-container">
        <h1>Focus Tea Room</h1>
        <div class="vintage-clock" id="retro-time">--:--:--</div>
    </div>

    <div class="dashboard-grid">
        <!-- Timer Card -->
        <div class="card">
            <h2>Deep Work Session</h2>
            <div class="timer-display" id="time-display">25:00</div>
            <div class="timer-controls">
                <button id="start-btn">Start</button>
                <button id="pause-btn" class="secondary">Pause</button>
                <button id="reset-btn" class="secondary">Reset</button>
            </div>
        </div>

        <!-- Todo Card -->
        <div class="card">
            <h2>Today's Brew</h2>
            <div class="todo-input-group">
                <input type="text" id="todo-input" placeholder="What needs to be done?">
                <button id="add-todo-btn">Add</button>
            </div>
            <ul id="todo-list">
                <!-- Items inject here -->
            </ul>
        </div>
    </div>

    <div style="margin-top: 40px;">
        <button class="secondary" onclick="window.location.href='archive.html'">View Past Records</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
